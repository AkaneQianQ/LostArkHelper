name: Build release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
        default: v0.2.0
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build and test standalone Windows folder
        shell: pwsh
        working-directory: windows
        run: ./build-windows.ps1 -Mode onedir -PythonExecutable (Get-Command python).Source
      - name: Create ZIP
        shell: pwsh
        run: python tools/package_release.py windows --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: windows-archive
          path: release-assets/*.zip
          if-no-files-found: error
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: linux/web/package-lock.json
      - name: Rebuild Linux workbench
        working-directory: linux/web
        run: |
          npm ci
          npm run build -- --outDir ../dist
      - name: Build and test standalone Linux folder
        run: |
          python -m pip install -r linux/requirements-build.txt
          bash linux/build-linux.sh
      - name: Create tar archive
        run: python tools/package_release.py linux --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: linux-archive
          path: release-assets/*.tar.gz
          if-no-files-found: error
  server:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify server, iPhone graph and four-edition activity policy
        run: |
          python -m unittest discover -s server/tests -v
          python -m unittest discover -s shortcuts/tests -v
          python verify_activity.py
      - name: Create server archive
        run: python tools/package_release.py server --version '${{ inputs.version }}'
      - uses: actions/upload-artifact@v4
        with:
          name: server-archive
          path: release-assets/*.tar.gz
          if-no-files-found: error
